name: Build wheels

on:
  push:
    tags:
      - "v*"           # trigger on version tags, e.g. v0.1.0
  workflow_dispatch:   # allow manual runs from the Actions tab

jobs:
  build_wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      # Regenerate the SQLite amalgamation (sqlite3.c / sqlite3.h) from the
      # source tree that was just checked out.  This must happen on the host
      # *before* cibuildwheel is invoked: on Linux, cibuildwheel runs builds
      # inside Docker and only copies sqldiff_python/ into the container, so
      # the parent source tree would not be visible inside Docker.
      # On Windows tclsh/make are not available, so we rely on the committed
      # sqlite_src/ files instead.
      - name: Install tclsh (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y tcl

      - name: Generate SQLite amalgamation
        if: runner.os != 'Windows'
        run: python sqldiff_python/generate_amalgamation.py

      - name: Set up QEMU (Linux aarch64 emulation)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22
        with:
          package-dir: sqldiff_python   # relative to repo root
          output-dir:  wheelhouse

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # Optionally publish to PyPI when a version tag is pushed.
  publish:
    name: Publish to PyPI
    needs: build_wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/sqlite3-sqldiff/
    permissions:
      id-token: write   # for trusted publishing (OIDC)

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
