[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite3-sqldiff"
description = "Python bindings for the SQLite sqldiff utility"
readme = "README.md"
requires-python = ">=3.10"
# Version is derived at build time from <sqlite-root>/VERSION by setup.py,
# so it always matches the SQLite release the package was built against.
dynamic = ["version"]

# ---------------------------------------------------------------------------
# cibuildwheel configuration
# ---------------------------------------------------------------------------
# Run:   pipx run cibuildwheel --platform linux   (or macos / windows)
# Or push to GitHub; the workflow at .github/workflows/build-wheels.yml
# handles all three platforms automatically.

[tool.cibuildwheel]
# Build for CPython 3.10–3.14.  Skip PyPy and 32-bit targets.
build  = "cp3{10,11,12,13,14}-*"
skip   = ["pp*", "*-manylinux_i686", "*-musllinux_i686", "*-win32"]

[tool.cibuildwheel.linux]
# The amalgamation is generated by the workflow step that runs
# generate_amalgamation.py on the host *before* cibuildwheel is invoked.
# cibuildwheel then copies the already-populated sqlite_src/ into the
# Docker container, so no before-all is needed here.
manylinux-x86_64-image  = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
# generate_amalgamation.py is run by the workflow step on the macOS host
# before cibuildwheel is invoked (cibuildwheel runs natively on macOS).
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
# tclsh / make are not readily available on the Windows runner, so the
# Windows build uses the committed sqlite_src/sqlite3.{c,h} files.
# Run  python generate_amalgamation.py  locally (e.g. in MSYS2) and
# commit the result before triggering a Windows release build.
archs = ["AMD64", "ARM64"]
